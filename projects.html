<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A polished portfolio template for showcasing your work, skills, and contact details.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.0">
	<style>
		.hero-grid {
			display: grid;
			grid-template-columns: minmax(300px, 1fr) minmax(290px, 1fr);
			gap: 24px;
			align-items: stretch;
		}

		.idImage {
			object-fit: cover;
			border-radius: 8px;
		}
	</style>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <nav class="topbar" aria-label="Primary">
                <p class="Home" href="#home">Tous mes projets</p>
                <div class="topbar-links">
                    <a href="#projPro">Projets Professionnels</a>
                    <a href="#projPerso">Projets Personnels</a>
                    <a href="#projSco">Projets Scolaires</a>
                </div>
            </nav>
            <a class="button button-primary" href="index.html">Retour au portfolio</a>
        </header>

        <main>

           <section class="section" id="projects">
                <div class="section-heading">
                    <p class="eyebrow">Mes projets</p>
                </div>
                <h2>Projets Professionels :</h2>
                <div id="projPro" class="projects-grid" aria-live="polite"></div>
                <h2>Projets Personnels :</h2>
                <div id="projPerso" class="projects-grid" aria-live="polite"></div>
                <h2>Projets Scolaires :</h2>
                <div id="projSco" class="projects-grid" aria-live="polite"></div>
            </section>

        </main>
    </div>
    <script src="projects.js?v=1.0"></script> 
</body>
</html>
